# Hand-maintained identity table for the Star Wars universe.
#
# `wikidata` pins reveal-screen facts to one exact Wikidata record. Needed where
# Gabasova's script name is ambiguous or too short for a reliable search
# (Emperor → Palpatine; Anakin and Darth Vader are correctly two people).
#
# Optional `wikidataSearch` overrides the string sent to Wikidata search when a
# pin is not used.
#
# Unknown ids fail the build rather than being ignored.

starwars:

  # --- Ambiguous or short script names ---------------------------------------

  emperor:
    wikidata: Q51770
    aliases: ["Palpatine", "Darth Sidious", "The Emperor"]

